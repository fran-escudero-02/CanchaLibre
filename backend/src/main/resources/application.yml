spring:
  application:
    name: canchalibre
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:canchalibre}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:canchalibre}
  jpa:
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo valida que las entidades matcheen.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Permite adoptar Flyway sobre una base existente creada antes de las migraciones:
    # marca el baseline en V1 y aplica las siguientes.
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

app:
  timezone: ${APP_TIMEZONE:America/Argentina/Buenos_Aires}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  slot:
    lock-minutes: ${SLOT_LOCK_MINUTES:5}
    release-rate-ms: ${SLOT_RELEASE_RATE_MS:60000}
  cancellation:
    refund-window-hours: ${REFUND_WINDOW_HOURS:2}
  mp:
    simulation: ${MP_SIMULATION:true}
  jwt:
    # Sin default: si no se define JWT_SECRET la aplicacion no arranca (fail-fast).
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}
