spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:canchalibre}_test
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  timezone: America/Argentina/Buenos_Aires
  frontend-url: http://localhost:5173
  slot:
    lock-minutes: 15
    release-rate-ms: 60000
  cancellation:
    refund-window-hours: 2
  mp:
    simulation: true
  jwt:
    # Solo para tests: secreto dedicado, nunca para producción.
    secret: secreto-de-pruebas-canchalibre-con-mas-de-256-bits-para-hmac-sha
    expiration-minutes: 60

mercadopago:
  access-token: ""
