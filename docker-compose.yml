services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: canchalibre
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: canchalibre
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PASSWORD: canchalibre
      JWT_SECRET: cambia-esta-clave-en-produccion-minimo-256-bits-de-longitud
      FRONTEND_URL: http://localhost:5173
      MP_SIMULATION: "true"
      MP_ACCESS_TOKEN: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
