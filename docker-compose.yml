services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: canchalibre
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: canchalibre
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PASSWORD: canchalibre
      # Obligatorio: sin JWT_SECRET el backend no arranca (fail-fast).
      # Valor solo para desarrollo local; generá el tuyo con:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      JWT_SECRET: _4YwEYtb_EdC8hvaxtKz_Kh0cjyd0ICJFSUOvHGQXHoxS59zxZmvAVnKtN6x16vq
      FRONTEND_URL: http://localhost:5173
      MP_SIMULATION: "true"
      MP_ACCESS_TOKEN: ""
      SLOT_LOCK_MINUTES: "5"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
